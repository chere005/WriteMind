<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!--
    WriteMind: the WM mark. One unbroken stroke, the family's move — CalMind's
    C runs into its M, AcctMind's A into its M — and here the W's last arm
    stands up straight and IS the M's first stem: \/\/ then |\/|. The M is
    the small one CalMind draws (stems 26 tall, valley 13 below the top); the
    W stands full height beside it.

    Ink blue (#38bdf8) rather than the family green, so it is not CalMind's
    tile from across the room. Centred on the measured ink box: the stroke's
    round caps and joins add half the width (4) on every side, so the path
    runs 16…80 × 24…72 and the ink 12…84 × 20…76 — both centred on 48.

    Regenerate every raster from this file: sh tools/make-icons.sh
  -->
  <rect width="96" height="96" rx="20" fill="#111111"/>
  <path d="M 16 24 L 30 72 L 44 44 L 58 72 L 58 46 L 69 59 L 80 46 L 80 72"
        fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
