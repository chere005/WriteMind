<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!--
    The APP ICON cut of the mark: full-bleed square, no corner radius of its
    own. macOS masks every app icon to its own squircle; an icon that arrives
    pre-rounded gets masked a second time and loses its corners. assets/logo.svg
    is the rounded cut for the README and anywhere the mark is a picture.
  -->
  <rect width="96" height="96" fill="#111111"/>
  <path d="M 16 24 L 30 72 L 44 44 L 58 72 L 58 46 L 69 59 L 80 46 L 80 72"
        fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
