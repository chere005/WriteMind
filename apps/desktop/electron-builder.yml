# How WriteMind is packaged, for the three platforms it runs on.
#
# ARCH LINUX IS A FIRST-CLASS TARGET (Sean, 2026-09-21: "make sure to
# target functioning on ArchLinux"), so `pacman` is in the list beside the
# AppImage — an Arch box installs the app with `pacman -U` and gets a
# desktop entry, an icon and a MIME type, rather than a file it has to
# remember where it put.
appId: com.seancheren.writemind
productName: WriteMind
copyright: Copyright © 2026 Shahean Cheren

# UPDATES come from this repo's own GitHub Releases (public). This block makes
# electron-builder write `resources/app-update.yml` into the installed app (what
# electron-updater reads: main/updater.ts) and, with `--publish always`, upload
# the installer, its .blockmap and latest.yml to the release for the version's
# tag — .github/workflows/release.yml does that on a pushed v* tag. A draft
# first: the workflow publishes it once every file is up, so no installed copy
# ever sees a release without its latest.yml. A local `package:win` publishes
# nothing (no tag, no token).
publish:
  provider: github
  owner: chere005
  repo: WriteMindCross
  releaseType: draft

directories:
  buildResources: ../../packaging
  output: ../../dist-electron

files:
  - out/**
  - package.json

# THE HELPER MUST BE A FILE ON DISK. Everything inside an asar archive is
# read through Electron, and nothing inside one can be executed — so the
# macOS Vision binary is unpacked beside it, and `helpers.ts` knows to look
# in `app.asar.unpacked` when it is running from an archive.
asarUnpack:
  - out/helpers/**
  # koffi prebuilt native addon (Wintab, main/pen/wintabNative.ts) must be a real file.
  - node_modules/koffi/**
  - node_modules/@koromix/**

mac:
  category: public.app-category.productivity
  # THE ICON is the Mac app's own (WriteMind/Assets.xcassets/AppIcon.appiconset,
  # 16 to 1024 px), which scripts/build.mjs packs into this .icns (scripts/icns.mjs)
  # - so WriteMind.app looks like the Swift WriteMind in the Dock and in Finder.
  # Without it electron-builder would convert packaging/icon.png (512 px).
  icon: out/icons/WriteMind.icns
  # THE IDENTITY BY ITS FINGERPRINT, not by its name — this says WHICH
  # certificate is meant, and it is the valid one.
  #
  # It is not the whole fix, and that is worth knowing: electron-builder
  # resolves the hash and then calls `codesign --sign <NAME>`, so a
  # keychain holding two certificates with the SAME name still fails with
  # "ambiguous". Sean's did — the first Apple Development certificate was
  # revoked on 2026-08-09 and reissued seven minutes later, and both were
  # left in the login keychain. The build picked the revoked one. The cure
  # is to take the dead one out (docs/BUILDING.md says how); this line
  # says which one to use once there is a choice again.
  identity: 744460685372E9982A2A85D7B351A9499AFF2EF6
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # The camera prompt's wording, which macOS shows verbatim.
  extendInfo:
    NSCameraUsageDescription: WriteMind uses the camera to take the writing off a notebook page.

win:
  # x64 only: one NSIS file holding two architectures is twice the download for
  # everyone, and WriteMind has not been tried on Windows on ARM.
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  # THE ICON is packaging/icon.png (512 px), which electron-builder turns into
  # the .ico for the exe, the installer, the uninstaller and the shortcuts. (The
  # git-ignored packaging/writemind.ico is tools/setup-windows.ps1's, for its
  # dev-build shortcuts; a clean clone or CI needs nothing more than icon.png.)
  icon: icon.png
  # UNSIGNED for now (no certificate, so nothing is configured to sign):
  # SmartScreen says "Windows protected your PC" on a first install, and
  # More info > Run anyway goes on. docs/INSTALL-WINDOWS.md.

# THE WINDOWS INSTALLER (docs/INSTALL-WINDOWS.md). Assisted, not one-click: a
# folder page and WriteMind's own page of optional tools (packaging/installer.nsh,
# found by its name in packaging/: install Python / the Wolfram Engine with
# winget, and activate the engine). FOR THIS WINDOWS USER ONLY, no administrator:
# %LOCALAPPDATA%\Programs\WriteMind, HKCU, and installer.nsh's customInstallMode
# skips the "only for me / anyone" page. Silent (/S, the updater's) installs show
# nothing and install nothing extra.
nsis:
  oneClick: false
  # THE LICENCE PAGE comes first (Sean, 2026-10-05: "make sure the installer
  # shows the license"): the repo's own LICENSE (BSD 3-Clause, "Copyright (c)
  # 2026, Shahean Cheren"), shown as plain text, and installer.nsh makes it the
  # "I accept the terms of the License Agreement" box that Next waits for. The
  # path is from packaging/ (the build resources folder), so it is the repo root's
  # LICENSE wherever the repo is checked out. An update (/S --updated) skips it.
  license: ../LICENSE
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: WriteMind
  uninstallDisplayName: WriteMind
  # THE NOTES ARE NEVER TOUCHED (they are in Documents\WriteMindCross, not in
  # the app's folder), and the app's own data (%APPDATA%\@writemind\desktop:
  # settings, sessions, pen.log) stays too unless the uninstaller is run with
  # --delete-app-data.
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  artifactName: ${productName}-Setup-${version}.${ext}

portable:
  artifactName: ${productName}-${version}-portable.${ext}

linux:
  category: Office
  # THE ICON is the rounded cut (packaging/icon.png, 512 px), as on Windows: a
  # Linux desktop masks nothing. Named here because, unnamed, electron-builder
  # would take it from mac.icon's full-bleed .icns.
  icon: icon.png
  synopsis: A notebook, a camera and a drawing layer over both
  description: >
    WriteMind is a markdown notebook whose notes are plain .md files in a
    folder, with a drawing layer over the words and a camera that takes the
    writing off a page. Nothing here is a database and nothing rewrites a
    file you did not type in.
  desktop:
    entry:
      MimeType: text/markdown;text/plain;
      Keywords: notes;markdown;notebook;writing;
  target:
    - target: pacman
      arch: [x64, arm64]
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64]

pacman:
  # What an Arch box needs BESIDE the app. `gtk3`, `nss` and `alsa-lib` are
  # Electron's own; `libnotify` and `xdg-utils` are the desktop's. Trashing
  # a note goes through `gio`, which is glib2's. TESSERACT IS NOT HERE ON
  # PURPOSE: it is the optional reader, and the app runs without it and
  # simply does not offer to read a picture (see docs/PORT.md) — the
  # PKGBUILD in packaging/arch lists it as an optdepend, which is the
  # field electron-builder's pacman target has no room for.
  depends:
    - gtk3
    - nss
    - alsa-lib
    - libnotify
    - xdg-utils
    - glib2

deb:
  depends:
    - libgtk-3-0
    - libnss3
    - libasound2
    - libnotify4
    - xdg-utils
