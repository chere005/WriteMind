# The TypeScript port on Windows: typecheck, unit tests, build; then the end-to-end suites (allowed to fail for
# now: they drive the real app, and they publish their report and screenshots either way).
# On pushes to main (and a manual run), the Mac package too: macos-15 typechecks, runs the unit tests (they must pass
# there as well), and builds the one ad-hoc dmg exactly as a release
# would (apps/desktop's package:mac:adhoc), checks it with tools/verify-mac.sh (every Mach-O arm64) and keeps it as an
# artifact for 14 days. APPLE SILICON ONLY: macos-15 is an Apple silicon (arm64) runner, and nothing is built for Intel.
# It never publishes anything; releases are .github/workflows/release.yml's.
# The Swift side of the repo is the macOS app's reference copy and is built and tested on a Mac, not here.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    name: End-to-end (optional)
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 40
    # The suites drive the real app on a hosted desktop: until they have proven steady there they inform, not block.
    continue-on-error: true
    env:
      # Hosted runners have no GPU worth the name.
      WM_E2E_ARGS: --disable-gpu
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: End-to-end suites
        run: npm run e2e -- --snapshot
      - name: Report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            e2e/.results/**
            !e2e/.results/**/profile/**
          if-no-files-found: ignore
          retention-days: 14

  mac-package:
    name: Mac dmg, Apple silicon (ad hoc, never published)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # Ad hoc, from package:mac:adhoc's own overrides: never go looking for a certificate (and there are no APPLE_*
      # variables, so nothing is notarized).
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      # They block here too: the seven that took Windows paths for granted now use this system's own (2026-10-05).
      - name: Unit tests
        run: npm test
      - name: Build (the arm64 tablet helper, tools/build-helpers.sh)
        run: npm run build
      - name: The arm64 dmg, signed ad hoc
        run: npm -w @writemind/desktop run package:mac:adhoc
      - name: Check it (signature, every Mach-O arm64, helpers, Info.plist, the dmg)
        run: bash tools/verify-mac.sh
      - name: The dmg as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: writemind-mac-dmg
          path: dist-electron/*-mac-*.dmg
          if-no-files-found: error
          retention-days: 14
