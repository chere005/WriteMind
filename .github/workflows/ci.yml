# The TypeScript port on Windows: typecheck, unit tests, build; then the end-to-end suites (allowed to fail for
# now: they drive the real app, and they publish their report and screenshots either way).
# On pushes to main (and a manual run), the Mac package too: macos-15 typechecks, runs the unit tests (they must pass
# there as well), and builds the one ad-hoc dmg exactly as a release
# would (apps/desktop's package:mac:adhoc, the bundled OCR reader's models required), checks it with
# tools/verify-mac.sh (every Mach-O arm64; the reader's files unpacked from the asar included) and keeps it as an
# artifact for 14 days. APPLE SILICON ONLY: macos-15 is an Apple silicon (arm64) runner, and nothing is built for Intel. It never publishes anything; releases are .github/workflows/release.yml's.
# The Swift side of the repo is the macOS app's reference copy and is built and tested on a Mac, not here.
name: CI

on:
  # Branches only: a release tag is the Release workflow's, which typechecks and runs the unit tests itself. A tag pushed
  # with its commit ran CI twice on the same commit (once for main, once for the tag) and doubled the chances of a
  # runner's hiccup mailing a failure.
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The bundled reader's models (docs/OCR-BUNDLED.md): pinned, sha256-checked, cached between runs. The build copies
      # them into the app and the unit tests read real pictures with them.
      - uses: actions/cache@v4
        with:
          path: apps/desktop/.cache/ocr-models
          key: ocr-models-${{ hashFiles('apps/desktop/scripts/ocr-models.json') }}
      - name: Bundled reader models
        run: node apps/desktop/scripts/fetch-ocr-models.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    name: End-to-end (optional)
    needs: verify
    runs-on: windows-latest
    # 40 was enough only while 88 scripts crashed in their first two seconds (no sidebar row for a note a script made): run
    # in full they took 42 minutes to get through 88 of 125 on 2026-10-16.
    timeout-minutes: 90
    # The suites drive the real app on a hosted desktop: until they have proven steady there they inform, not block.
    continue-on-error: true
    env:
      # Hosted runners have no GPU worth the name.
      WM_E2E_ARGS: --disable-gpu
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The bundled reader's models (docs/OCR-BUNDLED.md): pinned, sha256-checked, cached between runs. The build copies
      # them into the app and the unit tests read real pictures with them.
      - uses: actions/cache@v4
        with:
          path: apps/desktop/.cache/ocr-models
          key: ocr-models-${{ hashFiles('apps/desktop/scripts/ocr-models.json') }}
      - name: Bundled reader models
        run: node apps/desktop/scripts/fetch-ocr-models.mjs
      - name: Build
        run: npm run build
      - name: End-to-end suites
        run: npm run e2e -- --snapshot
      - name: Report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            e2e/.results/**
            !e2e/.results/**/profile/**
          # `.results` is a hidden folder, and upload-artifact leaves those out unless told: no report was ever uploaded.
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  mac-package:
    name: Mac dmg, Apple silicon (ad hoc, never published)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # Ad hoc, from package:mac:adhoc's own overrides: never go looking for a certificate (and there are no APPLE_*
      # variables, so nothing is notarized).
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # A release's own rule: the build fails rather than leave the bundled reader out, and verify-mac.sh then checks
      # its files are unpacked in the app (docs/OCR-BUNDLED.md).
      WM_REQUIRE_OCR_MODELS: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The bundled reader's models (docs/OCR-BUNDLED.md): pinned, sha256-checked, cached between runs. The build copies
      # them into the app and the unit tests read real pictures with them.
      - uses: actions/cache@v4
        with:
          path: apps/desktop/.cache/ocr-models
          key: ocr-models-${{ hashFiles('apps/desktop/scripts/ocr-models.json') }}
      - name: Bundled reader models
        run: node apps/desktop/scripts/fetch-ocr-models.mjs
      - name: Typecheck
        run: npm run typecheck
      # They block here too: the seven that took Windows paths for granted now use this system's own (2026-10-05).
      - name: Unit tests
        run: npm test
      - name: Build (the arm64 tablet helper and the Quick Look extension, tools/build-helpers.sh)
        run: npm run build
      - name: The arm64 dmg, signed ad hoc
        run: npm -w @writemind/desktop run package:mac:adhoc
      - name: Check it (signature, every Mach-O arm64, helper, bundled reader, Info.plist, the dmg)
        run: bash tools/verify-mac.sh
      - name: The dmg as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: writemind-mac-dmg
          path: dist-electron/*-mac-*.dmg
          if-no-files-found: error
          retention-days: 14
