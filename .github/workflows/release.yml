# Releases WriteMind for Windows and macOS on ONE GitHub Release. A pushed tag v<version> (or a manual run naming an
# existing tag) runs four jobs:
#
#   prepare  (ubuntu)    the tag must be apps/desktop/package.json's version; the notes are the tag's annotation (or its
#                        commit's message); a DRAFT release is made for the tag ("WriteMind <version>"). A draft left by an
#                        earlier run is reused; a release already published for the tag stops the run.
#   windows  (windows)   typecheck, unit tests, build; electron-builder makes the per-user NSIS installer and uploads it,
#                        its .blockmap and latest.yml into that draft. latest.yml on the newest release is the feed every
#                        installed Windows copy's updater reads (apps/desktop/src/main/updater.ts).
#   mac      (macos-15)  build (with the universal Vision helper); electron-builder makes WriteMind-<version>-mac-arm64.dmg
#                        and -mac-x64.dmg, AD-HOC signed (there is no Developer ID, so nothing is notarized) and never
#                        published by electron-builder; tools/verify-mac.sh checks them; gh uploads both into the draft.
#   publish  (ubuntu)    every file is on the draft, then it is published (Latest; a version with a "-" is a pre-release).
#
# A failed windows or mac job leaves the release a DRAFT that no installed copy sees: fix it, then re-run the failed job
# (publish runs after it). docs/BUILDING.md ("Releases and updates") says how to cut a release.
#
# Unsigned on Windows: SmartScreen says "Windows protected your PC" on a first install (More info > Run anyway). Ad hoc on
# the Mac: Gatekeeper stops the first open (docs/INSTALL-MAC.md: Privacy & Security > Open Anyway).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing tag to release, e.g. v0.5.1 (it must be apps/desktop/package.json's version with a v)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  GH_REPO: ${{ github.repository }}

jobs:
  prepare:
    name: Tag, notes and the draft release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0

      - name: The tag is the app's version
        id: version
        run: |
          # Case-sensitive (-cnotmatch, -cne): PowerShell's -match / -ne ignore case, and a "V0.5.1" tag would pass, then have
          # electron-builder make a release for a "v0.5.1" tag that does not exist.
          if ($env:TAG -cnotmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            Write-Output "::error title=Not a version tag::'$env:TAG' is not v<major>.<minor>.<patch>[-pre]."
            exit 1
          }
          $version = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          if ($env:TAG -cne "v$version") {
            Write-Output "::error title=Tag and version differ::The tag is $env:TAG but apps/desktop/package.json says $version. Set the version, commit, and tag v<version> on that commit (docs/BUILDING.md, Releases and updates)."
            exit 1
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Output "Releasing WriteMind $version from $env:TAG"

      - name: Release notes from the tag's annotation (or its commit's message)
        run: |
          # actions/checkout can leave an annotated tag as a lightweight one: fetch the tag object itself.
          git fetch --force origin "refs/tags/${env:TAG}:refs/tags/${env:TAG}"
          # The annotation when it says more than a title line; else the tagged commit's whole message.
          $body = (git for-each-ref "refs/tags/$env:TAG" --format='%(contents:body)') -join "`n"
          if ($body.Trim()) { $notes = (git for-each-ref "refs/tags/$env:TAG" --format='%(contents:subject)%0a%0a%(contents:body)') -join "`n" }
          else { $notes = (git log -1 --format=%B "$env:TAG^{commit}") -join "`n" }
          $notes = (($notes -split "`n") | Where-Object { $_ -notmatch '^(Co-Authored-By|Signed-off-by):' }) -join "`n"
          if (-not $notes.Trim()) { $notes = "WriteMind $env:VERSION" }
          $file = Join-Path $env:RUNNER_TEMP "release-notes.md"
          [IO.File]::WriteAllText($file, $notes.Trim() + "`n", [Text.UTF8Encoding]::new($false))
          Get-Content $file

      - name: The draft release for the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $notes = Join-Path $env:RUNNER_TEMP "release-notes.md"
          $title = "WriteMind $env:VERSION"
          # Every release for this tag, drafts included (a draft is not reachable by releases/tags/<tag>). The tag passed the
          # version pattern above, so it is safe inside the filter.
          $filter = '.[] | select(.tag_name == "' + $env:TAG + '") | .draft'
          $drafts = @(gh api "repos/$env:GH_REPO/releases?per_page=100" --paginate --jq $filter)
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::Could not list the releases of $env:GH_REPO"; exit 1 }
          if ($drafts -contains "false") {
            Write-Output "::error title=Already released::$env:TAG is a published release; it is never rebuilt. A new version needs a new tag (docs/BUILDING.md)."
            exit 1
          }
          if ($drafts.Count -gt 1) {
            Write-Output "::error title=Two drafts::$($drafts.Count) draft releases are waiting for ${env:TAG}: delete all but one on the Releases page, then re-run."
            exit 1
          }
          if ($drafts.Count -eq 1) {
            Write-Output "Reusing the draft release for $env:TAG (an earlier run's)"
            gh release edit $env:TAG --title $title --notes-file $notes
          } else {
            gh release create $env:TAG --draft --verify-tag --title $title --notes-file $notes
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  windows:
    name: Windows installer into the draft
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      # No certificate yet: build unsigned rather than look for one.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.TAG }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

      # No icon step: electron-builder.yml takes packaging/icon.png (tracked) for the exe, installer and shortcuts;
      # the git-ignored packaging/writemind.ico is only tools/setup-windows.ps1's, for dev shortcuts.

      - name: Release notes from the draft (for latest.yml)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new($false)
          $body = (gh release view $env:TAG --json body --jq .body) -join "`n"
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::No draft release for $env:TAG (the prepare job makes it)"; exit 1 }
          if (-not $body.Trim()) { $body = "WriteMind $env:VERSION" }
          $file = Join-Path $env:RUNNER_TEMP "release-notes.md"
          [IO.File]::WriteAllText($file, $body.Trim() + "`n", [Text.UTF8Encoding]::new($false))
          Get-Content $file

      - name: Installer, uploaded to the draft release
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $notes = Join-Path $env:RUNNER_TEMP "release-notes.md"
          & (Join-Path $env:GITHUB_WORKSPACE "node_modules/.bin/electron-builder.cmd") --win nsis --x64 --publish always `
            --config electron-builder.yml "-c.releaseInfo.releaseNotesFile=$notes" "-c.releaseInfo.releaseName=WriteMind $env:VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Installer as a build artifact too
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: writemind-${{ env.TAG }}-windows
          path: |
            dist-electron/*.exe
            dist-electron/*.blockmap
            dist-electron/latest.yml
          if-no-files-found: ignore
          retention-days: 14

  mac:
    name: Mac dmgs (signed and notarized when the secrets are set) into the draft
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      # Developer ID signing and notarization, from the repo's secrets (docs/MAC-SESSION.md). Without CSC_LINK the
      # job falls back to the ad-hoc dmgs of 1.0.0.
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.TAG }}

      # electron-builder wants APPLE_API_KEY as a PATH to the .p8, so the secret's contents go to a file.
      - name: Signing mode
        run: |
          if [ -n "$CSC_LINK" ] && [ -n "$APPLE_API_KEY_P8" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ]; then
            printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
            echo "WRITEMIND_MAC_SIGNED=1" >> "$GITHUB_ENV"
            echo "Developer ID signing and notarization"
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "No signing secrets: ad hoc, like 1.0.0"
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build (the Vision helper universal, tools/build-vision.sh)
        run: npm run build

      - name: The two dmgs, not published by electron-builder
        working-directory: apps/desktop
        run: |
          if [ "${WRITEMIND_MAC_SIGNED:-}" = 1 ]; then
            "$GITHUB_WORKSPACE/node_modules/.bin/electron-builder" --mac dmg zip --arm64 --x64 --publish never --config electron-builder.yml
          else
            # The same line as apps/desktop's package:mac:adhoc (ci.yml's mac-package job runs that script on main).
            npm run package:mac:adhoc
          fi

      - name: Check them (signature, chips, helper, Info.plist, the dmgs)
        run: bash tools/verify-mac.sh

      # Signed: the zips and latest-mac.yml too, which a Mac copy's updater installs from (an ad-hoc build makes none).
      - name: The dmgs (and, signed, the zips and latest-mac.yml), uploaded to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -l dist-electron/*-mac-*.dmg
          gh release upload "$TAG" dist-electron/*-mac-*.dmg --clobber
          if [ "${WRITEMIND_MAC_SIGNED:-}" = 1 ]; then
            ls -l dist-electron/*-mac-*.zip dist-electron/*-mac-*.zip.blockmap dist-electron/latest-mac.yml
            gh release upload "$TAG" dist-electron/*-mac-*.zip dist-electron/*-mac-*.zip.blockmap dist-electron/latest-mac.yml --clobber
          fi

      - name: The dmgs as a build artifact too
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: writemind-${{ env.TAG }}-mac
          path: dist-electron/*-mac-*.dmg
          if-no-files-found: ignore
          retention-days: 14

  publish:
    name: Every file is there; publish the release
    needs: [prepare, windows, mac]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Every file is there; publish the release
        run: |
          $names = @(gh release view $env:TAG --json assets --jq '.assets[].name')
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::No release for $env:TAG"; exit 1 }
          Write-Output "Assets: $($names -join ', ')"
          $missing = @()
          if (-not ($names -contains "latest.yml")) { $missing += "latest.yml" }
          if (-not ($names | Where-Object { $_ -like "*$env:VERSION*.exe" })) { $missing += "the installer (.exe)" }
          if (-not ($names | Where-Object { $_ -like "*$env:VERSION*.exe.blockmap" })) { $missing += "the .blockmap" }
          foreach ($dmg in @("WriteMind-$env:VERSION-mac-arm64.dmg", "WriteMind-$env:VERSION-mac-x64.dmg")) {
            if (-not ($names -contains $dmg)) { $missing += $dmg }
          }
          if ($missing.Count -gt 0) {
            Write-Output "::error title=Release incomplete::Missing $($missing -join ', '); the release stays a draft."
            exit 1
          }
          if ($env:VERSION -like "*-*") { gh release edit $env:TAG --draft=false --prerelease } else { gh release edit $env:TAG --draft=false --latest }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release view $env:TAG --json url --jq .url
